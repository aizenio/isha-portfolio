<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1440px; height:900px; display:flex; align-items:center; justify-content:center; gap:64px;
         background: radial-gradient(120% 120% at 50% 0%, #F0F1EE 0%, #E7E8E5 70%); }
  .device { width:264px; aspect-ratio:1206/2622; border-radius:34px; padding:7px; background:#22201d;
            box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 28px 56px -14px rgba(0,0,0,.38), 0 56px 112px -40px rgba(0,0,0,.42);
            outline:1px solid rgba(0,0,0,.10); }
  .screen { width:100%; height:100%; border-radius:27px; overflow:hidden; background:#FFFDF9; }
  img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
</style></head><body>
  <div class="device"><div class="screen"><img src="runway-light.png"></div></div>
  <div class="device"><div class="screen"><img src="log-light.png"></div></div>
  <div class="device"><div class="screen"><img src="plan-light.png"></div></div>
</body></html>
